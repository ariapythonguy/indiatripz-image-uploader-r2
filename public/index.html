<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive to R2 Uploader (4-Image Batch)</title>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2.5rem auto; padding: 0 1rem; color: #111; }
    .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    label.field-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; color: #334155; }
    input[type="password"], input[type="text"], select {
      width: 100%; padding: 0.6rem; margin-bottom: 0.75rem; border: 1px solid #cbd5e1;
      border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; background: #fff;
    }
    .sheet-box { background: #f8fafc; padding: 0.85rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 1rem; }
    .sheet-box input { margin-bottom: 0.5rem; }
    .sheet-box select { margin-bottom: 0; }
    .pkg-meta { font-size: 0.8rem; color: #475569; margin-top: 0.45rem; }
    .pkg-warn { color: #b45309; font-weight: 600; }
    .btn-group { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; }
    button, .file-label { flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; text-align: center; font-size: 0.95rem; }
    .btn-drive { background: #1a73e8; color: white; }
    .btn-local { background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; }
    .btn-upload { width: 100%; background: #0f172a; color: white; margin-top: 0.75rem; }
    .btn-upload:disabled { background: #94a3b8; cursor: not-allowed; }
    .preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-top: 0.75rem; }
    .slot { border: 1px dashed #cbd5e1; border-radius: 8px; padding: 0.4rem; text-align: center; background: #f8fafc; font-size: 0.75rem; color: #64748b; }
    .slot img { width: 100%; height: 75px; object-fit: cover; border-radius: 4px; display: block; margin-bottom: 0.25rem; }
    .slot-col { font-weight: 700; color: #0f172a; }
    .slot.has-file { border-style: solid; border-color: #94a3b8; background: #fff; cursor: grab; transition: transform 0.12s, border-color 0.12s, background 0.12s; }
    .slot.has-file:active { cursor: grabbing; }
    .slot.dragging { opacity: 0.45; transform: scale(0.97); }
    .slot.drag-over { border: 2px dashed #1a73e8; background: #eff6ff; }
    .slot-actions { display: flex; justify-content: center; gap: 0.25rem; margin-top: 0.3rem; }
    .btn-move { flex: 0 0 auto; padding: 0.15rem 0.45rem; font-size: 0.72rem; border-radius: 4px; background: #e2e8f0; color: #0f172a; border: none; cursor: pointer; }
    .btn-move:hover { background: #cbd5e1; }
    .drag-hint { font-size: 0.78rem; color: #64748b; margin-top: 0.35rem; text-align: right; }
    .result { display: none; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #e2e8f0; }
    .url-row { display: flex; gap: 0.5rem; margin-top: 0.45rem; align-items: center; }
    .col-badge { font-weight: 700; font-size: 0.8rem; background: #e2e8f0; padding: 0.35rem 0.55rem; border-radius: 5px; }
    .url-row input { flex: 1; margin-bottom: 0; background: #f8fafc; font-size: 0.85rem; }
    .btn-copy { flex: 0 0 auto; background: #10b981; color: white; padding: 0.45rem 0.8rem; font-size: 0.85rem; }
    #status { font-size: 0.9rem; color: #475569; margin-top: 0.65rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-top:0;">Upload 4 Package Images to R2</h2>

    <label class="field-label" for="secret">Upload Passcode</label>
    <input type="password" id="secret" placeholder="Enter passcode to load sheets..." />

    <div class="sheet-box">
      <label class="field-label" for="sheetSelect">1. Target State Sheet</label>
      <input type="text" id="sheetFilter" placeholder="Type to filter state sheets..." oninput="filterSheets()" />
      <select id="sheetSelect" onchange="onSheetChange()">
        <option value="">Enter passcode above to load sheets...</option>
      </select>
    </div>

    <div class="sheet-box">
      <label class="field-label" for="pkgSelect">2. Target Package Row (Column A: pkgID → Updates J, K, L, M)</label>
      <input type="text" id="pkgFilter" placeholder="Type pkgID to filter rows..." oninput="filterPackages()" />
      <select id="pkgSelect" onchange="updatePkgMeta()">
        <option value="">Select a state sheet first...</option>
      </select>
      <div class="pkg-meta" id="pkgMeta"></div>
    </div>

    <label class="field-label">3. Select Exactly 4 Images (Columns J, K, L, M)</label>
    <div class="btn-group">
      <button class="btn-drive" onclick="openDrivePicker()">Pick 4 from Google Drive</button>
      <label class="file-label btn-local">
        Choose 4 Local Files
        <input type="file" id="fileInput" accept="image/*" multiple hidden onchange="handleLocalFiles(event)" />
      </label>
    </div>

    <div class="preview-grid" id="previewGrid">
      <div class="slot"><div class="slot-col">Col J</div>Image 1</div>
      <div class="slot"><div class="slot-col">Col K</div>Image 2</div>
      <div class="slot"><div class="slot-col">Col L</div>Image 3</div>
      <div class="slot"><div class="slot-col">Col M</div>Image 4</div>
    </div>
    <div class="drag-hint" id="dragHint" style="display:none;">Drag &amp; drop cards (or use ← →) to reorder Columns J, K, L, M</div>

    <button class="btn-upload" id="uploadBtn" disabled onclick="uploadBatchToR2()">
      Upload 4 Images & Update Row
    </button>

    <div id="status"></div>

    <div class="result" id="resultBox">
      <strong id="resultLabel">Updated Columns J–M:</strong>
      <div id="urlList"></div>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "863919761365-3j4en5cspsiilelnrkneu80k1l4jjo64.apps.googleusercontent.com";
    const GOOGLE_API_KEY = "AIzaSyBmKDJSM4mMBf_f8aCkIelE7LW-20-cNuk";
    const COL_LABELS = ["Col J", "Col K", "Col L", "Col M"];

    let allSheets = [];
    let allPackages = [];
    let selectedFiles = [];
    let draggedIndex = null;

    const secretInput = document.getElementById("secret");
    const sheetSelect = document.getElementById("sheetSelect");
    const pkgSelect = document.getElementById("pkgSelect");
    const uploadBtn = document.getElementById("uploadBtn");

    secretInput.value = localStorage.getItem("r2_secret") || "";
    if (secretInput.value) loadSheets();

    let loadTimer;
    secretInput.addEventListener("input", () => {
      localStorage.setItem("r2_secret", secretInput.value);
      clearTimeout(loadTimer);
      loadTimer = setTimeout(loadSheets, 500);
    });

    async function loadSheets() {
      if (!secretInput.value) return;
      sheetSelect.innerHTML = `<option value="">Loading sheets...</option>`;
      try {
        const res = await fetch("/api/upload", {
          headers: { Authorization: `Bearer ${secretInput.value}` },
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Failed to load sheets");

        allSheets = data.sheets || [];
        renderSheetOptions(allSheets);
        setStatus("");
        if (sheetSelect.value) loadPackages(sheetSelect.value);
      } catch (err) {
        sheetSelect.innerHTML = `<option value="">Unlock with valid passcode</option>`;
        setStatus(`Sheet list: ${err.message}`);
      }
    }

    function renderSheetOptions(list) {
      const savedSheet = localStorage.getItem("r2_selected_sheet");
      sheetSelect.innerHTML = list.length
        ? list.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")
        : `<option value="">No matching sheets</option>`;

      if (savedSheet && list.includes(savedSheet)) {
        sheetSelect.value = savedSheet;
      }
    }

    function filterSheets() {
      const query = document.getElementById("sheetFilter").value.toLowerCase();
      const filtered = allSheets.filter((name) => name.toLowerCase().includes(query));
      renderSheetOptions(filtered);
      if (sheetSelect.value) loadPackages(sheetSelect.value);
    }

    function onSheetChange() {
      localStorage.setItem("r2_selected_sheet", sheetSelect.value);
      document.getElementById("pkgFilter").value = "";
      if (sheetSelect.value) loadPackages(sheetSelect.value);
    }

    async function loadPackages(sheetKey) {
      pkgSelect.innerHTML = `<option value="">Loading packages from ${escapeHtml(sheetKey)}...</option>`;
      document.getElementById("pkgMeta").textContent = "";
      allPackages = [];
      updateUploadButtonState();

      try {
        const res = await fetch(`/api/upload?sheetKey=${encodeURIComponent(sheetKey)}`, {
          headers: { Authorization: `Bearer ${secretInput.value}` },
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Failed to load packages");

        allPackages = data.packages || [];
        renderPackageOptions(allPackages);
      } catch (err) {
        pkgSelect.innerHTML = `<option value="">Error loading packages</option>`;
        setStatus(`Packages: ${err.message}`);
      }
    }

    function renderPackageOptions(list) {
      if (!list.length) {
        pkgSelect.innerHTML = `<option value="">No packages found in Column A</option>`;
        updatePkgMeta();
        return;
      }
      pkgSelect.innerHTML = list
        .map((p) => {
          const badge = p.hasImages ? ` [${p.imageCount}/4 imgs set]` : " [empty]";
          return `<option value="${p.row}" data-pkgid="${escapeHtml(p.pkgId)}" data-has="${p.hasImages}">Row ${p.row} — ${escapeHtml(p.pkgId)}${badge}</option>`;
        })
        .join("");
      updatePkgMeta();
    }

    function filterPackages() {
      const query = document.getElementById("pkgFilter").value.toLowerCase();
      const filtered = allPackages.filter(
        (p) => p.pkgId.toLowerCase().includes(query) || `row ${p.row}`.includes(query)
      );
      renderPackageOptions(filtered);
    }

    function updatePkgMeta() {
      const opt = pkgSelect.selectedOptions[0];
      const meta = document.getElementById("pkgMeta");
      if (!opt || !opt.value) {
        meta.textContent = "";
      } else if (opt.dataset.has === "true") {
        meta.innerHTML = `<span class="pkg-warn">Note: Row ${opt.value} (${escapeHtml(opt.dataset.pkgid)}) already has URLs in J:M — uploading will overwrite them.</span>`;
      } else {
        meta.textContent = `Ready to populate J${opt.value}:M${opt.value} for ${opt.dataset.pkgid}.`;
      }
      updateUploadButtonState();
    }

    function handleLocalFiles(event) {
      const files = Array.from(event.target.files || []);
      setSelectedFiles(files);
    }

    function setSelectedFiles(files) {
      if (files.length !== 4) {
        setStatus(`Please select 4 images at once (you selected ${files.length}).`);
      } else {
        setStatus("");
      }
      selectedFiles = files.slice(0, 4);
      renderPreviews();
      updateUploadButtonState();
    }

    function renderPreviews() {
      const grid = document.getElementById("previewGrid");
      const hint = document.getElementById("dragHint");
      hint.style.display = selectedFiles.length > 1 ? "block" : "none";

      grid.innerHTML = COL_LABELS.map((col, idx) => {
        const file = selectedFiles[idx];
        if (!file) {
          return `<div class="slot"><div class="slot-col">${col}</div>Image ${idx + 1}</div>`;
        }
        const objUrl = URL.createObjectURL(file);
        const leftBtn = idx > 0
          ? `<button type="button" class="btn-move" title="Move left" onclick="moveSlot(${idx}, ${idx - 1})">←</button>`
          : "";
        const rightBtn = idx < selectedFiles.length - 1
          ? `<button type="button" class="btn-move" title="Move right" onclick="moveSlot(${idx}, ${idx + 1})">→</button>`
          : "";

        return `
          <div class="slot has-file"
               draggable="true"
               ondragstart="onDragStart(event, ${idx})"
               ondragover="onDragOver(event)"
               ondragenter="onDragEnter(event)"
               ondragleave="onDragLeave(event)"
               ondrop="onDrop(event, ${idx})"
               ondragend="onDragEnd(event)">
            <img src="${objUrl}" alt="${escapeHtml(file.name)}" draggable="false" />
            <div class="slot-col">${col}</div>
            <div title="${escapeHtml(file.name)}">${escapeHtml(file.name.slice(0, 14))}</div>
            <div class="slot-actions">${leftBtn}${rightBtn}</div>
          </div>`;
      }).join("");
    }

    function onDragStart(event, index) {
      draggedIndex = index;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", String(index));
      event.currentTarget.classList.add("dragging");
    }

    function onDragOver(event) {
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
    }

    function onDragEnter(event) {
      event.preventDefault();
      const slot = event.currentTarget;
      if (slot.classList.contains("has-file")) {
        slot.classList.add("drag-over");
      }
    }

    function onDragLeave(event) {
      event.currentTarget.classList.remove("drag-over");
    }

    function onDrop(event, targetIndex) {
      event.preventDefault();
      event.currentTarget.classList.remove("drag-over");
      if (draggedIndex === null || draggedIndex === targetIndex) return;
      moveSlot(draggedIndex, targetIndex);
    }

    function onDragEnd() {
      draggedIndex = null;
      document.querySelectorAll(".slot").forEach((el) => {
        el.classList.remove("dragging", "drag-over");
      });
    }

    function moveSlot(fromIndex, toIndex) {
      if (toIndex < 0 || toIndex >= selectedFiles.length) return;
      const [moved] = selectedFiles.splice(fromIndex, 1);
      selectedFiles.splice(toIndex, 0, moved);
      renderPreviews();
    }

    function updateUploadButtonState() {
      uploadBtn.disabled = !(sheetSelect.value && pkgSelect.value && selectedFiles.length === 4);
    }

    function openDrivePicker() {
      if (!sheetSelect.value || !pkgSelect.value) {
        alert("Please select a target sheet and package row first.");
        return;
      }
      if (GOOGLE_CLIENT_ID.startsWith("YOUR_")) {
        alert("Configure GOOGLE_CLIENT_ID and GOOGLE_API_KEY in index.html first, or use 'Choose 4 Local Files'.");
        return;
      }
      gapi.load("picker", () => {
        const tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: "https://www.googleapis.com/auth/drive.readonly",
          callback: (tokenResponse) => {
            if (tokenResponse.error) {
              setStatus(`Google Auth Error: ${tokenResponse.error}`);
              return;
            }
            const accessToken = tokenResponse.access_token;
            const view = new google.picker.DocsView(google.picker.ViewId.DOCS_IMAGES)
              .setIncludeFolders(true);

            const picker = new google.picker.PickerBuilder()
              .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
              .addView(view)
              .setOAuthToken(accessToken)
              .setDeveloperKey(GOOGLE_API_KEY)
              .setCallback(async (data) => {
                if (data.action === google.picker.Action.PICKED) {
                  if (data.docs.length !== 4) {
                    alert(`Please select exactly 4 images in Google Drive (you picked ${data.docs.length}).`);
                    return;
                  }
                  setStatus("Downloading 4 images from Google Drive...");
                  try {
                    const downloaded = await Promise.all(
                      data.docs.map(async (doc) => {
                        const res = await fetch(
                          `https://www.googleapis.com/drive/v3/files/${doc.id}?alt=media&supportsAllDrives=true`,
                          { headers: { Authorization: `Bearer ${accessToken}` } }
                        );
                        if (!res.ok) {
                          const errText = await res.text();
                          throw new Error(`Drive download failed for "${doc.name}" (HTTP ${res.status}): ${errText}`);
                        }
                        const blob = await res.blob();
                        return new File([blob], doc.name, { type: doc.mimeType || blob.type });
                      })
                    );
                    setSelectedFiles(downloaded);
                  } catch (err) {
                    setStatus(`Error: ${err.message}`);
                  }
                }
              })
              .build();
            picker.setVisible(true);
          },
        });
        tokenClient.requestAccessToken({ prompt: "consent" });
      });
    }

    async function uploadBatchToR2() {
      const targetSheet = sheetSelect.value;
      const opt = pkgSelect.selectedOptions[0];
      const row = opt ? opt.value : "";
      const pkgId = opt ? opt.dataset.pkgid : "";

      if (!targetSheet || !row || selectedFiles.length !== 4) return;

      uploadBtn.disabled = true;
      setStatus(`Uploading 4 images to R2 and updating ${targetSheet} Row ${row} (${pkgId})...`);

      const formData = new FormData();
      selectedFiles.forEach((file) => formData.append("files", file));
      formData.append("sheetKey", targetSheet);
      formData.append("row", row);
      formData.append("pkgId", pkgId);

      try {
        const res = await fetch("/api/upload", {
          method: "POST",
          headers: { Authorization: `Bearer ${secretInput.value}` },
          body: formData,
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Batch upload failed");

        document.getElementById("resultLabel").textContent =
          `Saved to ${data.sheet} → Row ${data.row} (${data.pkgId}) [J${data.row}:M${data.row}]:`;

        document.getElementById("urlList").innerHTML = data.urls
          .map(
            (u, i) => `
            <div class="url-row">
              <span class="col-badge">${COL_LABELS[i]}</span>
              <input type="text" value="${escapeHtml(u)}" readonly />
              <button class="btn-copy" onclick="copyText(this, '${escapeHtml(u)}')">Copy</button>
            </div>`
          )
          .join("");

        document.getElementById("resultBox").style.display = "block";
        setStatus("Done! All 4 URLs written horizontally to Columns J, K, L, M.");
        await loadPackages(targetSheet); // Refresh package status badge
      } catch (err) {
        setStatus(`Error: ${err.message}`);
      } finally {
        updateUploadButtonState();
      }
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text);
      btn.textContent = "Copied!";
      setTimeout(() => (btn.textContent = "Copy"), 2000);
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
  </script>
</body>
</html>
